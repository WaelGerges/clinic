name: clinic_core
description: Shared clinic domain, data and presentation features.
publish_to: none
version: 0.2.0
resolution: workspace
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdf: 3.13.0
  printing: 5.15.0
  flutter_riverpod: 3.4.2
  go_router: 18.0.0
  supabase_flutter: 2.17.2
